spring:
  # 테스트 환경에서는 Docker Compose 비활성화 (Testcontainers 사용)
  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    com.example.cucumber: DEBUG
    org.testcontainers: INFO
