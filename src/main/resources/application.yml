spring:
  application:
    name: hello-cucumber-bdd

  # Docker Compose Support: compose.yaml 자동 감지 및 컨테이너 시작
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

  datasource:
    url: jdbc:postgresql://localhost:5432/cucumber_db
    username: cucumber_user
    password: cucumber_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway가 스키마 관리, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.example.cucumber: DEBUG
    org.flywaydb: INFO
